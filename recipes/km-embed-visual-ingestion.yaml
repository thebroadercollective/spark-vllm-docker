# Recipe: Qwen/Qwen3-VL-Embedding-8B
# Qwen/Qwen3-VL-Embedding-8B


recipe_version: "1"
name: Qwen/Qwen3-VL-Embedding-8B
description: vLLM serving Qwen/Qwen3-VL-Embedding-8B

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3-VL-Embedding-8B

solo_only: true

mods:
  - mods/pip-orjson

# Container image to use
container: vllm-node

# Default settings (can be overridden via CLI)
defaults:
  port: 8003
  host: 0.0.0.0
  gpu_memory_utilization: 0.27
  max_model_len: 16384
  max_num_batched_tokens: 4096
  max_num_seqs: 8

# Environment variables
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3-VL-Embedding-8B \
    --host {host} \
    --port {port} \
    --served-model-name km-embed-visual-ingestion \
    --hf-overrides '{{"is_matryoshka": true, "matryoshka_dimensions": [1024, 1536, 2000]}}' \
    --max-num-seqs {max_num_seqs} \
    --runner pooling \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --kv-cache-dtype fp8 \
    --max-model-len {max_model_len} \
    --load-format instanttensor
